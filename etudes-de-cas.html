<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Études de cas · Build Your Sales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: rails BYS (colonne 1200 bordée), étude de cas = article + fiche client collante */
:root{
  --bg:#FAFAFB; --bg2:#F1F1F4; --card:#FFFFFF; --ink:#0E0F1A; --ink2:#3B3E50; --mute:#5F6378; --line:#E4E4EA; --line2:#ECECF1;
  --accent:#4F4FFF; --accent-soft:#ECECFF; --on-accent:#FFFFFF;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D0E1A;--bg2:#121423;--card:#161828;--ink:#EDEEF6;--ink2:#C9CCE0;--mute:#A3A7C2;--line:#262839;--line2:#202233;--accent:#8C8CFF;--accent-soft:#1E2050;--on-accent:#0D0E1A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0E1A;--bg2:#121423;--card:#161828;--ink:#EDEEF6;--ink2:#C9CCE0;--mute:#A3A7C2;--line:#262839;--line2:#202233;--accent:#8C8CFF;--accent-soft:#1E2050;--on-accent:#0D0E1A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:1200px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:16px;color:var(--ink);text-decoration:none}
.brand small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-left:16px;border-left:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:4px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;transition:filter .2s}
.btn:hover{filter:brightness(1.08)}
.mono{font-family:var(--mono)}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chip{display:inline-block;padding:0 6px;border:1px dashed var(--mute);border-radius:4px;font-family:var(--mono);font-size:.78em;color:var(--mute);line-height:1.6;vertical-align:baseline}
.st{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--mute)}
.st i{width:6px;height:6px;border-radius:9999px;background:var(--mute)}
.st.pub i{background:var(--accent)}
/* index */
.ix-hero{padding-block:96px 48px}
.ix-hero h1{margin:16px 0 0;font-size:clamp(36px,5vw,60px);line-height:1.04;letter-spacing:-.04em;font-weight:600;text-wrap:balance;max-width:820px}
.ix-hero p{margin:20px 0 0;max-width:620px;font-size:18px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));border-top:1px solid var(--line);margin-left:calc(-1*max(24px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(24px,env(safe-area-inset-right,0px)))}
@media (max-width:640px){.grid{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}}
.card{display:flex;flex-direction:column;gap:14px;min-height:280px;padding:28px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg);transition:background-color .25s}
.card:hover{background:var(--card)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card h3{margin:0;font-size:20px;line-height:1.3;letter-spacing:-.02em;font-weight:500;text-wrap:balance}
.card .big{margin-top:auto;display:flex;align-items:baseline;gap:10px}
.card .big b{font-size:32px;font-weight:600;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.card .big span{font-size:13px;color:var(--mute)}
.card .more{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.card:hover .more{color:var(--accent)}
.wm{display:inline-flex;align-items:center;gap:8px;min-height:28px;color:var(--ink)}
.wm span{font-weight:600;letter-spacing:-.02em;font-size:16px}
.lg{display:block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:left center;mask-position:left center}
.card .wm,.also .wm{color:var(--ink2)}
.yt{position:relative;display:block;aspect-ratio:16/9;max-width:100%;margin:32px 0;overflow:hidden;background:#0D0E1A;color:#fff;text-decoration:none;border:1px solid var(--line)}
.yt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.35);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.yt:hover img{transform:scale(1.03)}
.yt-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,14,26,.15),rgba(13,14,26,.82))}
.yt-play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:9999px;background:#4F4FFF;display:grid;place-items:center;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.yt:hover .yt-play{transform:scale(1.08)}
.yt-meta{position:absolute;left:22px;right:22px;bottom:18px;display:flex;flex-direction:column;gap:6px}
.yt-meta .tag{color:#C9CCE0}
.yt-meta b{font-size:18px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
/* case */
.c-hero{padding-block:72px 0}
.back{font-family:var(--mono);font-size:12px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--accent)}
.c-tags{margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.c-hero h1{margin:16px 0 0;max-width:900px;font-size:clamp(34px,4.6vw,56px);line-height:1.05;letter-spacing:-.04em;font-weight:600;text-wrap:balance}
.c-hero .sub{margin:20px 0 0;max-width:720px;font-size:18px;color:var(--ink2);text-wrap:pretty}
.stats{margin-top:48px;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:24px 20px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:clamp(28px,3vw,40px);font-weight:600;letter-spacing:-.035em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{display:block;margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:64px;padding-block:56px 96px}
@media (max-width:980px){.body{grid-template-columns:minmax(0,1fr);gap:40px}.aside{order:-1}}
article{min-width:0;max-width:700px}
article p{margin:0 0 18px;color:var(--ink2)}
article h2{margin:56px 0 18px;font-size:28px;line-height:1.2;letter-spacing:-.03em;font-weight:500;text-wrap:balance}
article h2 + p{margin-top:0}
.kick{margin-top:56px;display:block}
.kick + h2{margin-top:10px}
article ul{margin:0 0 18px;padding-left:20px;color:var(--ink2)}
article li{margin:8px 0}
article li::marker{color:var(--mute)}
article strong{color:var(--ink);font-weight:600}
.tldr{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:var(--card)}
.tldr.one{grid-template-columns:1fr}
.also{padding-block:40px 64px;display:flex;flex-direction:column;gap:16px}
.also-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.also-row .wm{justify-content:center;}
@media (max-width:1100px){.also-row{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.also-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.also-row .wm{justify-content:center;min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.tldr > div{padding:20px 22px;min-width:0}
.tldr > div + div{border-left:1px solid var(--line)}
.tldr h3{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500}
.tldr > div + div h3{color:var(--accent)}
.tldr ul{margin:0;padding-left:18px;font-size:15px}
@media (max-width:640px){.tldr{grid-template-columns:1fr}.tldr > div + div{border-left:0;border-top:1px solid var(--line)}}
.steps{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:16px 0;margin:0;border-bottom:1px solid var(--line)}
.steps .n{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:3px}
.tbl{overflow-x:auto;margin:8px 0 24px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--bg2)}
td{color:var(--ink2);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink);font-weight:500}
blockquote{margin:28px 0;padding:4px 0 4px 22px;border-left:2px solid var(--accent)}
blockquote p{margin:0;font-size:21px;line-height:1.45;letter-spacing:-.015em;color:var(--ink);font-weight:400;text-wrap:pretty}
blockquote footer{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.av{width:36px;height:36px;border-radius:9999px;border:1px dashed var(--mute);flex:0 0 auto;object-fit:cover}
img.av{border:0;filter:grayscale(1)}
.av.sm{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.vid{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.vid:hover{color:var(--accent);border-color:var(--accent)}
.next{margin-top:56px;padding:28px;border:1px solid var(--line);background:var(--bg2)}
.next h2{margin:0 0 10px}
.next p{margin:0 0 20px}
.todo{margin-top:40px;padding:20px 22px;border:1px dashed var(--mute);font-size:14px}
.todo h3{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500}
.todo ul{margin:0;padding-left:18px}
.aside{min-width:0}
.fiche{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);border:1px solid var(--line);background:var(--card)}
.fiche .hd{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.fiche .hd p{margin:14px 0 0;font-size:14px;color:var(--ink2)}
.fiche dl{margin:0;padding:6px 22px}
.fiche dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.fiche dl div:last-child{border-bottom:0}
.fiche dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:2px;flex:0 0 auto}
.fiche dd{margin:0;text-align:right;color:var(--ink)}
.fiche .ft{padding:20px 22px 22px;border-top:1px solid var(--line)}
.fiche .ft p{margin:0 0 16px;font-size:14px;color:var(--ink2)}
.fiche .btn{width:100%}
.photo{aspect-ratio:16/9;max-width:100%;border-bottom:1px solid var(--line);background:var(--bg2);display:grid;place-items:center}
footer.foot{border-top:1px solid var(--line)}
footer.foot .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding-block:20px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
footer.foot a{text-decoration:none}
footer.foot a:hover{color:var(--accent)}
@media (max-width:520px){.brand small{display:none}.btn{padding:0 12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[\[(.+?)\]\]/g,'<span class="chip">$1</span>');}
function lg(slug,name,k){var L=LOGOS[slug];if(!L)return '<span class="wm"><span>'+esc(name)+'</span></span>';k=k||1;var h=Math.max(18,Math.min(40,Math.sqrt(2520/L[1])))*k,w=h*L[1];return '<span class="wm" role="img" aria-label="'+esc(name)+'"><i class="lg" style="width:'+w.toFixed(1)+'px;height:'+h.toFixed(1)+'px;-webkit-mask-image:url('+L[0]+');mask-image:url('+L[0]+')"></i>'+(slug==='avaeda'?'<span>Avaeda</span>':'')+'</span>';}
function wm(c,k){return lg(c.slug,c.name,k);}
function face(who){for(var i=0;i<MATCH.length;i++){if(who.indexOf(MATCH[i][0])>-1)return PEOPLE[MATCH[i][1]];}return null;}
function av(who){var f=face(who);return f?'<img class="av" src="'+f+'" alt="">':'<span class="av" aria-hidden="true"></span>';}
var ST={site:["pub","Publié sur le site"],video:["pub","Vidéo publiée"],mix:["","Citations à valider"],tldv:["","Accord client à obtenir"]};
function status(c){var s=ST[c.status];return '<span class="st '+s[0]+'"><i></i>'+s[1]+'</span>';}
function quote(q){return '<blockquote><p>« '+md(q.text)+' »</p><footer>'+av(q.who)+'<span>'+esc(q.who)+'</span>'+'</footer></blockquote>';}
function index(){
  document.title="Études de cas BYS";
  var h='<section class="ix-hero"><p class="tag">Études de cas</p><h1>Ils prospectent avec Build Your Sales.</h1><p>Le ciblage, la méthode et les résultats, client par client. Chaque chiffre vient de nos livraisons ou de ce que nos clients nous ont dit.</p></section><section><div class="grid">';
  CASES.forEach(function(c){h+='<a class="card" href="#'+c.slug+'"><div class="row"><span class="tag">['+esc(c.sector)+']</span></div>'+wm(c)+'<h3>'+md(c.title)+'</h3><div class="big"><b>'+md(c.stats[0][0])+'</b><span>'+esc(c.stats[0][1])+'</span></div><span class="more">Lire l\'étude de cas →</span></a>';});

}

  h+='<span class="tag kick">Résultats</span><h2>Les résultats en bref</h2><div class="tbl"><table><thead><tr><th scope="col">Indicateur</th><th scope="col">Résultat</th></tr></thead><tbody>'+c.results.map(function(r){return '<tr><td>'+md(r[0])+'</td><td>'+md(r[1])+'</td></tr>';}).join('')+'</tbody></table></div>';
  (c.quotes||[]).forEach(function(q){h+=quote(q);});
  h+='<div class="next"><h2>Votre cible ressemble à celle de '+esc(c.name)+' ?</h2><p>Un data engineer cadre votre ciblage avec vous et vous montre ce qu\'on peut trouver sur votre marché.</p><a class="btn" href="'+CAL+'" target="_blank" rel="noopener">Parler à l\'équipe</a></div>';
  h+='</article><aside class="aside"><div class="fiche">'+(PHOTOS[c.slug]&&!c.video?'<div class="photo"><img src="'+PHOTOS[c.slug]+'" alt=""></div>':'')+'<div class="hd">'+wm(c)+'<p>'+md(c.about.desc)+'</p></div><dl>'+c.about.rows.map(function(r){var f=r[0]==='Contact'&&face(r[1]);return '<div><dt>'+esc(r[0])+'</dt><dd>'+(f?'<img class="av sm" src="'+f+'" alt=""> ':'')+md(r[1])+'</dd></div>';}).join('')+'</dl><div class="ft"><p>Vous voulez la même base sur votre cible ?</p><a class="btn" href="'+CAL+'" target="_blank" rel="noopener">Parler à l\'équipe</a></div></div></aside></div></section>';
  return h;
}
function route(){
  var id=location.hash.replace(/^#/,""), c=CASES.filter(function(x){return x.slug===id;})[0];
  document.getElementById("app").innerHTML=c?page(c):index();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route); route();
</script>
